<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ocean blue rounded background -->
  <rect width="32" height="32" rx="8" fill="#00a8cc"/>
  <!-- Scooter icon (white) scaled to fit the 32×32 box -->
  <g transform="translate(3,7) scale(0.464)">
    <!-- Rear wheel -->
    <circle cx="10" cy="27" r="8" stroke="white" stroke-width="2.5" fill="none"/>
    <circle cx="10" cy="27" r="3" fill="white"/>
    <!-- Front wheel -->
    <circle cx="46" cy="27" r="8" stroke="white" stroke-width="2.5" fill="none"/>
    <circle cx="46" cy="27" r="3" fill="white"/>
    <!-- Body -->
    <path d="M16,22 C18,10 38,9 44,19 L45,24 C38,26 18,25 16,22Z" fill="white"/>
    <!-- Seat -->
    <path d="M22,16 Q31,9 40,14 Q34,8 26,10 Z" fill="white" opacity="0.75"/>
    <!-- Handlebar post -->
    <line x1="43" y1="18" x2="48" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Handlebars -->
    <line x1="46" y1="6" x2="53" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Rear frame -->
    <line x1="16" y1="22" x2="11" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
